spring:
  profiles:
    active: local
    group:
      local: db-local
      server: db-server
    include:
      - db
      - security
  datasource:
    driver-class-name: ${DATABASE_DRIVER}
    jdbc-url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      repositories:
        enabled: false
expire:
  defaultTime: 36288000
mybatis:
  mapper-locations: classpath:com.fastcampus.boardserver.mapper/*.xml